name: Finite diagnostic tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: PYTHONPATH=src python -m unittest discover -s tests -v
      - run: PYTHONPATH=src python -m etal.g0 --out /tmp/g0_grid.csv
      - run: diff results/g0_grid.csv /tmp/g0_grid.csv
